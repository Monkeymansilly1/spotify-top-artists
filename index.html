<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Top Spotify</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:rgba(255,255,255,.08);--text:#eafff2;--muted:#8fbfa4;--accent:#1ed760}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#000 0%,#04150c 45%,#0d6b33 100%) fixed;color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.4}
main{max-width:1000px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;margin:0 0 20px;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;background:var(--panel);color:var(--text)}
button:hover{background:rgba(255,255,255,.16)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views button.on,.tabs button.on,.counts button.on,#login{background:var(--accent);color:#000;font-weight:700}
.views{display:flex;gap:8px;margin-bottom:14px}
.views button{font-size:1.05rem;padding:12px 24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tabs button{padding:8px 16px;font-size:.92rem}
.counts{display:flex;gap:6px;margin-bottom:14px}
.counts button{padding:6px 12px;font-size:.85rem}
#logout{margin-left:auto}
ol{list-style:none;margin:0;padding:0}
.track{padding:8px 0}
.track a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.track a:hover b,.track a:focus-visible b{color:var(--accent);text-decoration:underline}
.track img{width:56px;height:56px;flex:none;border-radius:4px;object-fit:cover}
.track b{display:block}
.track span{color:var(--muted);font-size:.9rem}
.rank{width:26px;flex:none;text-align:right;color:var(--accent);font-weight:800}
.artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px}
.artist{display:block;text-align:center;font-size:.95rem;color:inherit;text-decoration:none}
.artist:hover,.artist:focus-visible{color:var(--accent)}
.artist:hover img,.artist:focus-visible img{outline:3px solid var(--accent)}
.artist img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;margin-bottom:6px}
.artist small{color:var(--accent);font-weight:800;margin-right:4px}
.welcome{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.welcome img,.welcome .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.welcome .avatar{display:grid;place-items:center;background:var(--accent);color:#000;font-weight:800;font-size:1.4rem}
.welcome p{margin:0;font-size:1.15rem;color:var(--muted)}
.welcome b{color:var(--text)}
.welcome a.me{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
.welcome a.me:hover b,.welcome a.me:focus-visible b{color:var(--accent);text-decoration:underline}
.welcome a.me:hover img,.welcome a.me:focus-visible img,.welcome a.me:hover .avatar,.welcome a.me:focus-visible .avatar{outline:3px solid var(--accent)}
.welcome a.me:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:999px}
#err{color:#ff8a8a}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>My top Spotify</h1>
  <div id="login-view">
    <p>Log in to see your most played tracks and artists.</p>
    <button id="login">Log in with Spotify</button>
  </div>
  <div id="app" class="hide">
    <div id="welcome" class="welcome hide"></div>
    <div class="views" role="group" aria-label="View">
      <button data-v="tracks" class="on">Top tracks</button>
      <button data-v="artists">Top artists</button>
    </div>
    <div class="tabs" role="group" aria-label="Time range">
      <button data-r="short_term">Last month</button>
      <button data-r="medium_term" class="on">6 months</button>
      <button data-r="long_term">Past year</button>
      <button id="logout" aria-label="Log out">Log out</button>
    </div>
    <div class="counts" role="group" aria-label="Number of results">
      <button data-n="10" class="on">Top 10</button>
      <button data-n="25">Top 25</button>
      <button data-n="50">Top 50</button>
    </div>
    <section id="tracks-view"><ol id="tracks"></ol></section>
    <section id="artists-view" class="hide"><div id="artists" class="artists"></div></section>
  </div>
  <p id="err"></p>
</main>

<script>
// 1. Paste your Client ID from developer.spotify.com/dashboard
const CLIENT_ID = "9cf1c588e2de4aaea8f093ac325c5922";
// 2. Add this exact URL as a Redirect URI in your Spotify app settings
const REDIRECT = location.origin + location.pathname;
const SCOPE = "user-top-read";

const $ = s => document.querySelector(s);
const err = m => $("#err").textContent = m;

// --- PKCE helpers ---
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/[+/=]/g,"").slice(0,n)}
async function challenge(v){
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function login(){
  const verifier = rand(64);
  sessionStorage.setItem("verifier", verifier);
  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT,
    scope: SCOPE, code_challenge_method: "S256", code_challenge: await challenge(verifier)
  });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}

async function getToken(code){
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams({
      client_id: CLIENT_ID, grant_type: "authorization_code", code,
      redirect_uri: REDIRECT, code_verifier: sessionStorage.getItem("verifier")
    })
  });
  const d = await r.json();
  if(!d.access_token) throw new Error(d.error_description || "Login failed");
  sessionStorage.setItem("token", d.access_token);
}

async function api(path){
  const r = await fetch("https://api.spotify.com/v1" + path, {
    headers: {Authorization: "Bearer " + sessionStorage.getItem("token")}
  });
  if(r.status === 401){ sessionStorage.removeItem("token"); location.reload(); }
  if(!r.ok) throw new Error("Spotify API error " + r.status);
  return r.json();
}

const state = {view: "tracks", range: "medium_term", n: 10};
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  err("");
  $("#tracks-view").classList.toggle("hide", state.view !== "tracks");
  $("#artists-view").classList.toggle("hide", state.view !== "artists");
  try{
    if(state.view === "tracks"){
      const t = await api(`/me/top/tracks?limit=${state.n}&time_range=${state.range}`);
      $("#tracks").innerHTML = t.items.map((x,i)=>`
        <li class="track"><a href="${x.external_urls.spotify}" target="_blank" rel="noopener">
          <span class="rank">${i+1}</span>
          <img src="${x.album.images.at(-2)?.url || ""}" alt="">
          <div><b>${esc(x.name)}</b><span>${esc(x.artists.map(y=>y.name).join(", "))}</span></div>
        </a></li>`).join("");
    }else{
      const a = await api(`/me/top/artists?limit=${state.n}&time_range=${state.range}`);
      $("#artists").innerHTML = a.items.map((x,i)=>`
        <a class="artist" href="${x.external_urls.spotify}" target="_blank" rel="noopener">
          <img src="${x.images[0]?.url || ""}" alt=""><small>${i+1}</small>${esc(x.name)}
        </a>`).join("");
    }
  }catch(e){ err(e.message); }
}

async function loadProfile(){
  try{
    const me = await api("/me");
    const name = me.display_name || me.id || "there";
    const pic = me.images?.[0]?.url;
    const url = me.external_urls?.spotify || ("https://open.spotify.com/user/" + encodeURIComponent(me.id));
    $("#welcome").innerHTML =
      `<a class="me" href="${esc(url)}" target="_blank" rel="noopener" title="Open your Spotify profile">` +
      (pic ? `<img src="${esc(pic)}" alt="">` : `<div class="avatar" aria-hidden="true">${esc(name[0].toUpperCase())}</div>`) +
      `<p>Welcome, <b>${esc(name)}</b></p></a>`;
    $("#welcome").classList.remove("hide");
  }catch(e){ /* welcome banner is optional; ignore failures */ }
}

function pick(selector, key, attr, parse){
  document.querySelectorAll(selector).forEach(b => b.onclick = () => {
    document.querySelectorAll(selector).forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    state[key] = parse(b.dataset[attr]);
    load();
  });
}
pick(".views button[data-v]", "view", "v", v => v);
pick(".tabs button[data-r]", "range", "r", v => v);
pick(".counts button", "n", "n", Number);

$("#login").onclick = login;
$("#logout").onclick = () => {
  sessionStorage.removeItem("token");
  sessionStorage.removeItem("verifier");
  location.href = REDIRECT;
};

(async () => {
  const code = new URLSearchParams(location.search).get("code");
  try{
    if(code){
      await getToken(code);
      history.replaceState({}, "", REDIRECT);
    }
    if(sessionStorage.getItem("token")){
      $("#login-view").classList.add("hide");
      $("#app").classList.remove("hide");
      load();
      loadProfile();
    }
  }catch(e){ err(e.message); }
})();
</script>
</body>
</html>
